        '<td class="num">' + pc + '</td><td class="num"><button class="btn small" data-ordpdf="' + esc(so.id) + '">PDF</button> ' +
        '<button class="btn small danger" data-orddel="' + esc(so.id) + '">Διαγραφή</button></td></tr>';
    }
    h += '</tbody></table></div>';
  }
  return h;
}

/* Έγγραφο A4 παραγγελίας. Ομαδοποίηση ανά κατηγορία, με ΔΙΚΟ ΤΗΣ πίνακα η
   καθεμία: τα μεγέθη γίνονται στήλες (XS…3XL για ενηλίκων, 0-6…18-24 για
   βρεφικά κ.λπ.), οπότε ο προμηθευτής βλέπει έναν καθαρό πίνακα ανά
   προϊόν × μέγεθος — αντί για μια μακριά λίστα γραμμών. */
function buildOrderDoc(order, isDraft){
  var st = settings.store || {}, lines = order.lines || [];
  var cats = {}, catOrder = [];
  for (var i = 0; i < lines.length; i++) {
    var c = lines[i].category || "Χωρίς κατηγορία";
    if (!cats[c]) { cats[c] = { prods: {}, prodOrder: [], sizes: {}, sizeList: [] }; catOrder.push(c); }
    var g = cats[c], pid = lines[i].productId;
    /* Το όνομα (Διακριτικός Τίτλος) ΔΕΝ πάει στον προμηθευτή — είναι
       εσωτερικό του καταστήματος. Ο προμηθευτής αναγνωρίζει το είδος από
       Κωδικό Στάμπας + Χρώμα (+ φωτογραφία). Το παλιό όνομα κρατιέται μόνο
       για τις γραμμές στην οθόνη, όχι στο PDF. */
    if (!g.prods[pid]) {
      var curP = findProduct(pid);
      g.prods[pid] = { code: lines[i].code || "", color: lines[i].color || (curP && !lines[i].hasOwnProperty("color") ? curP.color || "" : ""), q: {}, tot: 0 };
      g.prodOrder.push(pid);
    }
    g.prods[pid].q[lines[i].size] = (g.prods[pid].q[lines[i].size] || 0) + lines[i].qty;
    g.prods[pid].tot += lines[i].qty;
    if (!g.sizes[lines[i].size]) { g.sizes[lines[i].size] = 1; g.sizeList.push(lines[i].size); }
  }
  function catIdx(c){ var x = CATEGORIES.indexOf(c); return x < 0 ? 99 : x; }
  catOrder.sort(function(a,b){ return catIdx(a) - catIdx(b); });

  var d = order.ts ? new Date(order.ts) : new Date();
  var dateStr = pad2(d.getDate()) + "/" + pad2(d.getMonth()+1) + "/" + d.getFullYear();
  var storeName = st.name || "ARCHES";
  var storeLines = [st.address, st.phone ? "Τηλ. " + st.phone : "", st.email, st.vat ? "ΑΦΜ " + st.vat : ""].filter(Boolean);

  var h = '<div class="pd"><div class="hd"><img src="' + $("app").querySelector(".logo").getAttribute("src") + '" alt="ARCHES">' +
    '<div class="ttl"><h1>ΠΑΡΑΓΓΕΛΙΑ</h1><div class="meta">' +
    (isDraft ? '<span class="draft-mark">ΠΡΟΣΧΕΔΙΟ</span>' : 'Αρ. <b>' + esc(order.number) + '</b>') +
    ' · ' + dateStr + '</div></div></div>';

  h += '<div class="parties"><div class="box"><div class="k">Από</div><b>' + esc(storeName) + '</b>' +
    (storeLines.length ? '<br>' + storeLines.map(esc).join("<br>") : '') + '</div>' +
    '<div class="box"><div class="k">Προς</div><b>' + esc(order.supplier || "—") + '</b>' +
    (order.supplierInfo ? '<br>' + esc(order.supplierInfo) : '') + '</div></div>';

  var grand = 0, grandProds = 0;
  for (var ci = 0; ci < catOrder.length; ci++) {
    var cg = cats[catOrder[ci]];
    cg.sizeList.sort(function(a,b){ return (sizeRank(a) - sizeRank(b)) || String(a).localeCompare(String(b)); });
    cg.prodOrder.sort(function(a,b){
      return cg.prods[a].code.localeCompare(cg.prods[b].code, "el", { numeric: true }) || cg.prods[a].color.localeCompare(cg.prods[b].color, "el");
    });
    h += '<h3>' + esc(catOrder[ci]) + '</h3><table><thead><tr><th></th><th>Κωδ. Στάμπας</th><th>Χρώμα</th>';
    for (var si = 0; si < cg.sizeList.length; si++) h += '<th class="q">' + esc(cg.sizeList[si]) + '</th>';
    h += '<th class="tot">Σύνολο</th></tr></thead><tbody>';
    var colTot = {}, catTot = 0;
    for (var pj = 0; pj < cg.prodOrder.length; pj++) {
      var pr = cg.prods[cg.prodOrder[pj]], cur = findProduct(cg.prodOrder[pj]);
      h += '<tr><td class="ph">' + (cur && cur.photo ? '<img src="' + cur.photo + '" alt="">' : '') + '</td>' +
        '<td>' + esc(pr.code || "—") + '</td><td>' + esc(pr.color || "—") + '</td>';
      for (var sk = 0; sk < cg.sizeList.length; sk++) {
        var qv = pr.q[cg.sizeList[sk]] || 0;
        colTot[cg.sizeList[sk]] = (colTot[cg.sizeList[sk]] || 0) + qv;
        h += '<td class="q">' + (qv ? qv : '') + '</td>';
      }
      h += '<td class="tot">' + pr.tot + '</td></tr>';
      catTot += pr.tot;
    }
    h += '<tr class="sum"><td></td><td colspan="2">Σύνολο ' + esc(catOrder[ci]) + '</td>';
    for (var sm = 0; sm < cg.sizeList.length; sm++) h += '<td class="q">' + (colTot[cg.sizeList[sm]] || '') + '</td>';
    h += '<td class="tot">' + catTot + '</td></tr></tbody></table>';
    grand += catTot; grandProds += cg.prodOrder.length;
  }

  h += '<div class="grand"><span>Είδη: <b>' + grandProds + '</b></span><span>Σύνολο τεμαχίων: <b>' + grand + '</b></span></div>';
  if (order.notes) h += '<div class="notes"><b>Σημειώσεις:</b>\n' + esc(order.notes) + '</div>';
  h += '<div class="foot"><span>Παρακαλούμε επιβεβαιώστε διαθεσιμότητα και ημερομηνία παράδοσης.</span><span>' + esc(storeName) + '</span></div></div>';
  return h;
}

/* Εκτύπωση → ο χρήστης διαλέγει «Αποθήκευση ως PDF» (desktop) ή
   Κοινή χρήση → PDF (κινητό). Αλλάζουμε προσωρινά το document.title
   γιατί από αυτό βγαίνει το προτεινόμενο όνομα αρχείου του PDF. */
function printOrder(order, isDraft){
  $("printDoc").innerHTML = buildOrderDoc(order, isDraft);
  var oldTitle = document.title;
  document.title = "ARCHES_Paraggelia_" + (isDraft ? "prosxedio_" + dayKey(new Date()) : order.number);
  document.body.classList.add("print-order");
  function cleanup(){
    document.body.classList.remove("print-order");
    document.title = oldTitle;
    window.removeEventListener("afterprint", cleanup);
  }
  window.addEventListener("afterprint", cleanup);
  /* Μικρή καθυστέρηση ώστε να "ζωγραφιστούν" οι φωτογραφίες πριν ανοίξει
     ο διάλογος εκτύπωσης — αλλιώς σε κάποιους browsers βγαίνουν κενές. */
  setTimeout(function(){
    window.print();
    /* Safari σε iOS δεν στέλνει πάντα afterprint· καθαρίζουμε και με timer. */
    setTimeout(cleanup, 1500);
  }, 300);
}
function findSupplierOrder(id){
  for (var i = 0; i < supplierOrders.length; i++) if (supplierOrders[i].id === id) return supplierOrders[i];
  return null;
}

/* ---------- Ρυθμίσεις (ιδιοκτήτης) ---------- */
function storeField(id, label, val){
  return '<div style="margin-bottom:10px"><label class="f">' + label + '</label><input type="text" id="' + id + '" value="' + esc(val || "") + '"></div>';
}
function renderSettings(){
  return '<h2>Ρυθμίσεις</h2><div class="card pad" style="max-width:420px">' +
    '<label class="f">PIN υπαλλήλου</label><div class="row" style="flex-wrap:nowrap">' +
    '<input type="text" id="empPin" inputmode="numeric" maxlength="8" value="' + esc(settings.employeePin) + '">' +
    '<button class="btn primary" data-savepin>Αποθήκευση</button></div>' +
    '<p class="muted" style="font-size:13px">Το PIN ιδιοκτήτη ορίζεται μέσα στον κώδικα (ADMIN_PIN). ' +
    'Τα PIN αποτρέπουν λάθη ρόλου — δεν είναι πραγματική προστασία δεδομένων.</p></div>' +
    '<h3 style="margin-top:24px">Στοιχεία καταστήματος</h3><div class="card pad" style="max-width:520px">' +
    '<p class="muted" style="font-size:13px;margin-top:0">Εμφανίζονται στο PDF της παραγγελίας προς τον προμηθευτή.</p>' +
    storeField("stName", "Επωνυμία", (settings.store || {}).name || "ARCHES") +
    storeField("stAddress", "Διεύθυνση", (settings.store || {}).address) +
    storeField("stPhone", "Τηλέφωνο", (settings.store || {}).phone) +
    storeField("stEmail", "Email", (settings.store || {}).email) +
    storeField("stVat", "ΑΦΜ", (settings.store || {}).vat) +
    '<button class="btn primary" data-savestore>Αποθήκευση στοιχείων</button></div>' +
    '<p class="muted" style="margin-top:20px;font-size:13px">' + (offline ? 'Κατάσταση: <b>offline mode</b>' : 'Κατάσταση: συνδεδεμένο στο Firestore (' + esc(FIREBASE_CONFIG.projectId) + ')') + '</p>';
}


/* ==========================================================================
   9. MODAL
   ========================================================================== */
function openModal(html){
  var root = $("modalRoot");
  root.innerHTML = '<div class="modal-bg">' + html + '</div>';
  return root.firstChild;
}
function closeModal(){ $("modalRoot").innerHTML = ""; }
document.addEventListener("keydown", function(e){ if (e.key === "Escape" || e.keyCode === 27) closeModal(); });


/* ==========================================================================
   10. EVENTS
   Event delegation στο #view: το innerHTML ξαναγράφεται σε κάθε render,
   οπότε handlers δεμένοι σε μεμονωμένα στοιχεία θα χάνονταν.
   ========================================================================== */
function bindEvents(){
  var roleBtns = document.querySelectorAll(".roles button");
  for (var i = 0; i < roleBtns.length; i++) {
    roleBtns[i].onclick = function(){ selectLoginRole(this.getAttribute("data-role")); $("pin").focus(); };
  }
  $("loginBtn").onclick = tryLogin;
  $("pin").onkeydown = function(e){ if (e.key === "Enter" || e.keyCode === 13) tryLogin(); };
  $("logoutBtn").onclick = function(){ setRole(null); };

  $("tabs").onclick = function(e){
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    tab = b.getAttribute("data-tab");
    search = "";
    catFilter = "";
    renderAll();
  };

  $("view").addEventListener("input", function(e){
    if (e.target.id === "search") { search = e.target.value; renderAll(); }
  });
  $("view").addEventListener("change", function(e){
    /* Παραγγελία: πεδία κειμένου γράφονται στο change (blur), όχι ανά πλήκτρο. */
    if (e.target.id === "ordSupplier") { draft.supplier = e.target.value.trim(); saveDraft(); return; }
    if (e.target.id === "ordSupplierInfo") { draft.supplierInfo = e.target.value.trim(); saveDraft(); return; }
    if (e.target.id === "ordNotes") { draft.notes = e.target.value; saveDraft(); return; }
    if (e.target.hasAttribute && e.target.hasAttribute("data-oqin")) {
      setDraftQty(e.target.getAttribute("data-oqin"), e.target.getAttribute("data-os"), e.target.value);
      return;
    }
    if (e.target.id === "reportDate" && e.target.value) {
      reportDay = e.target.value > currentDay ? currentDay : e.target.value;
      subscribeReport();
    }
  });

  $("view").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("button") : null;
    if (b) {
      if (b.hasAttribute("data-cat")) { catFilter = b.getAttribute("data-cat"); renderAll(); return; }
      if (b.hasAttribute("data-oq")) {
        var pid = b.getAttribute("data-oq"), sz = b.getAttribute("data-os");
        setDraftQty(pid, sz, draftQty(pid, sz) + (+b.getAttribute("data-d")));
        return;
      }
      if (b.hasAttribute("data-ordclear")) {
        var cp = b.getAttribute("data-ordclear") + "|";
        for (var lk in draft.lines) if (draft.lines.hasOwnProperty(lk) && lk.indexOf(cp) === 0) delete draft.lines[lk];
        saveDraft();
        return;
      }
      if (b.hasAttribute("data-ordempty")) {
        if (!confirmInline(b, "Σίγουρα;")) return;
        draft.lines = {};
        saveDraft();
        return;
      }
      if (b.hasAttribute("data-ordpreview")) {
        printOrder({ lines: draftLines(), supplier: draft.supplier, supplierInfo: draft.supplierInfo, notes: draft.notes, ts: Date.now() }, true);
        return;
      }
      if (b.hasAttribute("data-ordfinal")) {
        if (!confirmInline(b, "Επιβεβαίωση ολοκλήρωσης")) return;
        b.disabled = true;
        finalizeOrder().then(function(order){
          showOk("Η παραγγελία " + order.number + " ολοκληρώθηκε.");
          printOrder(order, false);
        }, function(err){ b.disabled = false; showError("Ολοκλήρωση παραγγελίας", err); });
        return;
      }
      if (b.hasAttribute("data-ordpdf")) {
        var so = findSupplierOrder(b.getAttribute("data-ordpdf"));
        if (so) printOrder(so, false);
        return;
      }
      if (b.hasAttribute("data-orddel")) {
        if (!confirmInline(b, "Σίγουρα;")) return;
        deleteSupplierOrder(b.getAttribute("data-orddel")).then(function(){ showOk("Η παραγγελία διαγράφηκε."); }, function(err){ showError("Διαγραφή παραγγελίας", err); });
        return;
      }
      if (b.hasAttribute("data-savestore")) {
        saveStoreInfo({
          name: $("stName").value.trim(), address: $("stAddress").value.trim(), phone: $("stPhone").value.trim(),
          email: $("stEmail").value.trim(), vat: $("stVat").value.trim()
        }).then(function(){ showOk("Τα στοιχεία αποθηκεύτηκαν."); }, function(err){ showError("Στοιχεία καταστήματος", err); });
        return;
      }
      if (b.hasAttribute("data-sell")) { openSellModal(b.getAttribute("data-sell"), b.getAttribute("data-size")); return; }
      if (b.hasAttribute("data-undo")) {
        if (!confirmInline(b, "Σίγουρα;")) return;
        b.disabled = true;
        undoSale(b.getAttribute("data-undo")).then(function(){ showOk("Η πώληση αναιρέθηκε."); }, function(err){ b.disabled = false; showError("Αναίρεση", err); });
        return;
      }
      if (b.hasAttribute("data-new")) { openProductModal(null); return; }
      if (b.hasAttribute("data-edit")) { openProductModal(b.getAttribute("data-edit")); return; }
      if (b.hasAttribute("data-day")) { reportDay = shiftDay(reportDay, +b.getAttribute("data-day")); if (reportDay > currentDay) reportDay = currentDay; subscribeReport(); return; }
      if (b.hasAttribute("data-print")) { window.print(); return; }
      if (b.hasAttribute("data-savepin")) {
        var v = $("empPin").value.trim();
        if (!/^\d{4,8}$/.test(v)) { showError("PIN", new Error("Το PIN πρέπει να είναι 4–8 ψηφία.")); return; }
        saveEmployeePin(v).then(function(){ showOk("Το PIN αποθηκεύτηκε."); }, function(err){ showError("PIN", err); });
        return;
      }
      return;
    }
    /* Tap σε compact κάρτα (mobile) → expand/collapse. Σε desktop δεν
       αλλάζει τίποτα οπτικά, γιατί όλα τα κελιά είναι ήδη ορατά. */
    var tr = e.target.closest ? e.target.closest("tr[data-row]") : null;
    if (tr) { var k = tr.getAttribute("data-row"); openRows[k] = !openRows[k]; renderAll(); }
  });
}


/* ==========================================================================
   11. BOOT
   ========================================================================== */
function injectResponsiveHelpers(){
  /* .m-only / .d-only: ίδια πληροφορία, διαφορετική θέση σε mobile/desktop.
     Ορίζονται εδώ κοντά στη χρήση τους για να είναι προφανής ο σκοπός. */
  var st = document.createElement("style");
  st.textContent = ".m-only{display:none}@media (max-width:900px){.m-only{display:inline}table.t.cards td.d-only{display:none !important}}";
  document.head.appendChild(st);
}

function boot(){
  $("appVersion").textContent = APP_VERSION;
  injectResponsiveHelpers();
  bindEvents();
  initFirebase();
  startListeners();
  var r = savedRole();
  if (r) setRole(r); else showLogin();
}

boot();

})();
</script>
