<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f5">
<title>ARCHES · Απόθεμα & Βάρδιες</title>
<!--
  Firebase compat SDK (ΟΧΙ το modular v9+).
  Γιατί compat: δίνει global `firebase` χωρίς imports/modules, άρα δουλεύει
  μέσα σε ένα μόνο στατικό index.html χωρίς build step / bundler.
  Αν το CDN δεν φορτώσει, το `firebase` μένει undefined και η εφαρμογή
  πέφτει σε offline mode (βλ. initFirebase) αντί να σπάσει.
-->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
/* ==========================================================================
   DESIGN TOKENS
   Όλα τα χρώματα/typography ζουν εδώ ως custom properties, ώστε το dark mode
   να είναι απλώς ένα override block και να μην υπάρχουν literals σκορπισμένα.
   Η παλέτα ακολουθεί το logo ARCHES: μαύρο μελάνι σε ζεστό λευκό, serif.
   ========================================================================== */
:root{
  --bg:#faf8f5;
  --surface:#ffffff;
  --surface-2:#f3f0eb;
  --ink:#151515;
  --ink-2:#5b5752;
  --ink-3:#8f8a83;
  --line:#e4dfd8;
  --accent:#151515;          /* κύρια κουμπιά: μαύρο όπως το logo */
  --accent-ink:#ffffff;
  --warn:#9a6b00;
  --warn-bg:#fff4d6;
  --danger:#b3261e;
  --danger-bg:#fdecea;
  --ok:#2e6b3a;
  --ok-bg:#e7f3e9;
  --undo:#b3261e;             /* χρώμα αστερίσκου αναίρεσης */
  --logo-filter:none;         /* στο dark mode αντιστρέφουμε το μαύρο logo */
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-serif:Georgia,"Times New Roman",serif;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
/* Dark mode: ακολουθεί το σύστημα, ΚΑΙ μπορεί να εξαναγκαστεί με
   data-theme="dark" στο <html> (για μελλοντικό toggle χωρίς αλλαγή CSS). */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1b1b1b; --surface-2:#242424;
    --ink:#f2efea; --ink-2:#bdb7ae; --ink-3:#8a847c; --line:#2f2f2f;
    --accent:#f2efea; --accent-ink:#121212;
    --warn:#f0c14b; --warn-bg:#3a2f12; --danger:#ff8a80; --danger-bg:#3b1a18;
    --ok:#8fd19e; --ok-bg:#16301c; --undo:#ff8a80;
    --logo-filter:invert(1);
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1b1b1b; --surface-2:#242424;
  --ink:#f2efea; --ink-2:#bdb7ae; --ink-3:#8a847c; --line:#2f2f2f;
  --accent:#f2efea; --accent-ink:#121212;
  --warn:#f0c14b; --warn-bg:#3a2f12; --danger:#ff8a80; --danger-bg:#3b1a18;
  --ok:#8fd19e; --ok-bg:#16301c; --undo:#ff8a80;
  --logo-filter:invert(1);
  --shadow:none;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.hidden{display:none !important}

/* ---------- Banners (offline / error / ok) ---------- */
#banners{position:sticky;top:0;z-index:50}
/* Τα μηνύματα επιτυχίας είναι toasts κάτω-κάτω: δεν σπρώχνουν το περιεχόμενο
   όπως τα error/offline banners, που πρέπει να μένουν μέχρι να τα δει κάποιος. */
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
#toasts .banner{border:0;border-radius:var(--radius-sm);box-shadow:var(--shadow);pointer-events:auto}
.banner{padding:10px 16px;font-size:14px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line)}
.banner b{font-weight:600}
.banner .x{margin-left:auto;background:none;border:0;cursor:pointer;font-size:18px;line-height:1;color:inherit;padding:0 4px}
.banner.offline{background:var(--warn-bg);color:var(--warn)}
.banner.error{background:var(--danger-bg);color:var(--danger)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}

/* ---------- Header ---------- */
header.app{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{height:40px;filter:var(--logo-filter);display:block}
header.app .who{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:14px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:12px;letter-spacing:.04em;text-transform:uppercase}

nav.tabs{display:flex;gap:4px;padding:0 24px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:12px 14px;cursor:pointer;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.active{color:var(--ink);border-bottom-color:var(--ink)}

main{max-width:1100px;margin:0 auto;padding:24px}
h1,h2,h3{font-family:var(--font-serif);font-weight:normal;margin:0 0 12px}
h2{font-size:24px}
h3{font-size:18px}
.muted{color:var(--ink-3)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:6px 10px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=search],input[type=number],input[type=password],input[type=date]{
  padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);min-height:42px;width:100%}
input:focus{outline:2px solid var(--ink);outline-offset:-1px}
label.f{display:block;font-size:13px;color:var(--ink-2);margin:0 0 4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:16px}
.empty{padding:32px;text-align:center;color:var(--ink-3)}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#login .box{width:100%;max-width:380px;text-align:center}
#login .logo{height:64px;margin:0 auto 28px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.roles button{padding:18px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);cursor:pointer}
.roles button.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.roles .t{font-family:var(--font-serif);font-size:18px;display:block}
.roles .s{font-size:12px;color:var(--ink-3)}
#pin{text-align:center;letter-spacing:.5em;font-size:22px}
.login-err{color:var(--danger);font-size:14px;min-height:20px;margin:8px 0}

/* ---------- Πώληση: grid προϊόντων ---------- */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:16px}
.prod{padding:14px}
.prod .name{font-family:var(--font-serif);font-size:17px}
.prod .meta{font-size:12px;color:var(--ink-3);margin-bottom:10px}
.sizes{display:flex;flex-wrap:wrap;gap:6px}
.size{min-width:54px;padding:8px 8px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;text-align:center;line-height:1.15}
.size .l{display:block;font-weight:600}
.size .q{display:block;font-size:11px;color:var(--ink-3)}
.size:hover{border-color:var(--ink)}
.size.zero{opacity:.4;cursor:not-allowed}
.size.low .q{color:var(--warn)}

/* ---------- Φωτογραφίες ---------- */
/* Λόγος 4:5 (πορτρέτο) γιατί έτσι φωτογραφίζονται συνήθως τα ρούχα·
   object-fit:contain ώστε να μην κόβεται το ρούχο σε οριζόντιες φωτό. */
.prod{padding:0;overflow:hidden;display:flex;flex-direction:column}
.prod .body{padding:14px}
.photo{aspect-ratio:4/5;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.photo .ph{font-family:var(--font-serif);color:var(--ink-3);font-size:32px}
.thumb{width:44px;height:55px;border-radius:6px;background:var(--surface-2);object-fit:contain;display:block}
.thumb.ph{display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-family:var(--font-serif)}
.photo-field{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.photo-field .photo{width:96px;flex:none;border-radius:var(--radius-sm)}
.cell-flex{display:flex;gap:10px;align-items:center}

/* ---------- Φίλτρο κατηγοριών ---------- */
.cats{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;-webkit-overflow-scrolling:touch}
.cats button{white-space:nowrap;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.cats button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cats .n{opacity:.6;font-size:12px;margin-left:4px}
select{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);min-height:42px;width:100%}
tr.cat-head td{background:var(--surface-2);font-family:var(--font-serif);font-size:15px;padding:8px 12px}

/* ---------- Παραγγελία προμηθευτή ---------- */
.ord-top{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 16px}
textarea{padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);width:100%;min-height:42px;resize:vertical;font:inherit;color:inherit}
.basket-line{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.basket-line:last-child{border-bottom:0}
.basket-line .chip{background:var(--surface-2)}
.ord-prod{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ord-prod:last-child{border-bottom:0}
.ord-prod.has{background:var(--surface-2)}
.ord-sizes{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.osz{border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px;background:var(--surface);text-align:center;min-width:92px}
.osz.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.osz .l{font-weight:600;font-size:13px}
.osz .st{font-size:11px;color:var(--ink-3)}
.osz .st.zero{color:var(--danger)}
.step{display:flex;align-items:center;gap:2px;margin-top:4px}
.step button{width:28px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;padding:0;font-size:16px;line-height:1}
.step input{width:36px;min-height:30px;height:30px;padding:2px;text-align:center;border-radius:6px}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step input{-moz-appearance:textfield}

/* ---------- Πίνακες / λίστες ---------- */
table.t{width:100%;border-collapse:collapse}
table.t th,table.t td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600}
table.t td.num,table.t th.num{text-align:right;white-space:nowrap}
tr.undone td{color:var(--ink-3)}
tr.undone .strike{text-decoration:line-through}
.star{color:var(--undo);font-weight:700}
.chip{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:6px;font-size:12px;margin:2px 4px 2px 0;white-space:nowrap}
.chip.zero{color:var(--danger);border-color:var(--danger)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.stat{padding:14px 16px}
.stat .v{font-family:var(--font-serif);font-size:28px}
.stat .k{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{width:100%;max-width:520px;max-height:92vh;overflow:auto}
.modal h3{margin-bottom:4px}
.qty{display:flex;align-items:center;justify-content:center;gap:16px;margin:20px 0}
.qty button{width:52px;height:52px;border-radius:50%;font-size:24px}
.qty .v{font-family:var(--font-serif);font-size:40px;min-width:60px;text-align:center}
.size-rows .sr{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;margin-bottom:8px;align-items:center}

/* Expand/collapse: σε desktop όλα ανοιχτά, σε mobile κλειστά (βλ. media query) */
.exp-toggle{display:none}

/* ==========================================================================
   MOBILE (≤900px): αλλάζει layout, όχι απλώς μικραίνει.
   Οι πίνακες γίνονται compact κάρτες με tap-to-expand, γιατί μια γραμμή
   προϊόντος με 8 μεγέθη δεν χωράει οριζόντια σε κινητό.
   ========================================================================== */
@media (max-width:900px){
  header.app{padding:10px 14px}
  .logo{height:30px}
  nav.tabs{padding:0 8px}
  main{padding:14px}
  /* Σε κινητό: 2 στήλες με φωτογραφία, ώστε να βλέπει ο υπάλληλος
     περισσότερα ρούχα ανά οθόνη και να τα αναγνωρίζει από την εικόνα. */
  .prod-grid{grid-template-columns:1fr 1fr;gap:8px}
  .prod .body{padding:10px}
  .prod .name{font-size:15px}
  .size{min-width:44px;padding:6px 4px}
  .stats{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat{padding:10px}
  .stat .v{font-size:22px}

  table.t.cards thead{display:none}
  table.t.cards,table.t.cards tbody{display:block}
  table.t.cards tr{display:block;border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--surface);padding:10px 12px;cursor:pointer}
  table.t.cards td{display:block;border:0;padding:2px 0}
  /* Μόνο τα κελιά .primary φαίνονται σε κλειστή κάρτα· τα υπόλοιπα με tap. */
  /* .act = κουμπί ενέργειας (π.χ. Αναίρεση): πάντα ορατό, για να μη χρειάζεται δύο taps. */
  table.t.cards tr:not(.open) td:not(.primary):not(.act){display:none}
  table.t.cards td.act{margin-top:6px}
  table.t.cards td.num{text-align:left}
  table.t.cards td[data-l]:before{content:attr(data-l) ": ";color:var(--ink-3);font-size:12px}
  .exp-toggle{display:inline;float:right;color:var(--ink-3)}
  .ord-top{grid-template-columns:1fr}
  .ord-prod{grid-template-columns:44px 1fr;padding:10px}
  /* Σταθερό πλάτος 1/3: με flex-grow το τελευταίο μέγεθος (π.χ. 3XL) θα απλωνόταν σε όλη τη γραμμή. */
  .osz{min-width:0;flex:0 0 calc((100% - 16px) / 3)}
  .modal-bg{align-items:flex-end;padding:0}
  .modal{max-width:none;border-radius:var(--radius) var(--radius) 0 0}
}

/* ---------- Έγγραφο παραγγελίας (μόνο για εκτύπωση / PDF) ----------
   Το PDF φτιάχνεται από τον browser (Εκτύπωση → Αποθήκευση ως PDF) και ΟΧΙ
   με βιβλιοθήκη τύπου jsPDF: έτσι τα ελληνικά, το logo και οι φωτογραφίες
   βγαίνουν σωστά χωρίς ενσωμάτωση γραμματοσειρών, και δεν προστίθεται
   εξάρτηση από άλλο CDN. Χρώματα σταθερά (όχι tokens): το χαρτί είναι
   πάντα λευκό, ακόμα κι αν η συσκευή είναι σε dark mode. */
#printDoc{display:none}
.pd{font-family:var(--font-sans);color:#111;font-size:11pt;line-height:1.35}
.pd .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:14px}
.pd .hd img{height:46px;filter:none}
.pd .hd .ttl{text-align:right}
.pd .hd .ttl h1{font-family:var(--font-serif);font-size:20pt;margin:0;letter-spacing:.04em}
.pd .meta{font-size:10pt;color:#444}
.pd .parties{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.pd .box{border:1px solid #bbb;border-radius:4px;padding:8px 10px;font-size:10pt}
.pd .box .k{font-size:8pt;text-transform:uppercase;letter-spacing:.08em;color:#666;margin-bottom:3px}
.pd .box b{font-size:11pt}
.pd h3{font-family:var(--font-serif);font-size:13pt;margin:14px 0 6px;color:#111}
.pd table{width:100%;border-collapse:collapse;font-size:10pt;page-break-inside:auto}
.pd tr{page-break-inside:avoid}
.pd th,.pd td{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:middle}
.pd th{background:#f1f1f1;font-size:8.5pt;text-transform:uppercase;letter-spacing:.04em}
.pd td.q,.pd th.q{text-align:center;width:42px}
.pd td.tot,.pd th.tot{text-align:center;width:52px;font-weight:700;background:#f7f7f7}
.pd td.ph{width:40px;padding:2px}
.pd td.ph img{width:34px;height:42px;object-fit:contain;display:block}
.pd tr.sum td{font-weight:700;background:#f7f7f7}
.pd .grand{display:flex;justify-content:flex-end;gap:24px;margin-top:14px;font-size:12pt;border-top:2px solid #111;padding-top:8px}
.pd .notes{margin-top:14px;border:1px solid #bbb;border-radius:4px;padding:8px 10px;font-size:10pt;white-space:pre-wrap}
.pd .foot{margin-top:24px;font-size:9pt;color:#555;display:flex;justify-content:space-between}
.pd .draft-mark{color:#b3261e;font-weight:700}

@page{size:A4;margin:12mm}
@media print{
  /* Εκτύπωση παραγγελίας: κρύβουμε ΟΛΗ την εφαρμογή και δείχνουμε μόνο
     το έγγραφο. Για άλλες εκτυπώσεις (αναφορά βάρδιας) το #printDoc μένει κρυφό. */
  body.print-order #app, body.print-order #login, body.print-order #modalRoot, body.print-order #toasts, body.print-order #banners{display:none !important}
  body.print-order #printDoc{display:block}
  body.print-order{background:#fff}
  .pd *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header.app nav, nav.tabs, #banners, .no-print{display:none !important}
  body{background:#fff}
  .card{box-shadow:none}
}
</style>
</head>
<body>

<div id="banners"></div>
<div id="toasts"></div>

<!-- ======================= LOGIN ======================= -->

var CATEGORY_SIZES = {

function sizeRank(size){
  for (var c in CATEGORY_SIZES) {

    var i = CATEGORY_SIZES[c].indexOf(size);

  var n = parseFloat(size);
  return isNaN(n) ? 1000 : 100 + n;
}

function pad2(n){ return (n < 10 ? "0" : "") + n; }

/* Η "βάρδια" = ημερολογιακή μέρα της ΣΥΣΚΕΥΗΣ (τοπική ώρα, όχι UTC).
   Αν χρησιμοποιούσαμε toISOString() θα παίρναμε UTC, και μια πώληση στις
   01:30 ώρα Ελλάδας θα πήγαινε στη χθεσινή βάρδια. */
function dayKey(d){
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
function dayLabel(k){
  var p = k.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  var days = ["Κυριακή","Δευτέρα","Τρίτη","Τετάρτη","Πέμπτη","Παρασκευή","Σάββατο"];
  return days[d.getDay()] + " " + p[2] + "/" + p[1] + "/" + p[0];
}
function shiftDay(k, delta){
  var p = k.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2] + delta);
  return dayKey(d);
}
function timeLabel(ts){
  if (!ts) return "";
  var d = new Date(ts);
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function newId(){
  /* Για offline mode μόνο· online τα ids τα δίνει το Firestore. */
  return "local_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function findProduct(id){
  for (var i = 0; i < products.length; i++) if (products[i].id === id) return products[i];
  return null;
}
function sizeQty(p, s){
  for (var i = 0; i < (p.sizes || []).length; i++) if (p.sizes[i].s === s) return p.sizes[i].q;
  return 0;
}
function totalStock(p){
  var t = 0;
  for (var i = 0; i < (p.sizes || []).length; i++) t += p.sizes[i].q;
  return t;
}
/* Αντίγραφο του sizes array: δεν πειράζουμε ποτέ in-place αντικείμενα που
   ήρθαν από snapshot, γιατί ο επόμενος listener θα τα αντικαταστήσει. */
function cloneSizes(sizes){
  var out = [];
  for (var i = 0; i < (sizes || []).length; i++) out.push({ s: sizes[i].s, q: sizes[i].q });
  return out;
}


/* ==========================================================================
   4. BANNERS
   Κάθε αποτυχία (listener ή write) εμφανίζεται με το ΠΡΑΓΜΑΤΙΚΟ μήνυμα
   του Firestore, π.χ. "Missing or insufficient permissions" όταν λείπει
   security rule. Ποτέ σιωπηλή αποτυχία.
   ========================================================================== */
var bannerSeq = 0;
function showBanner(kind, html, sticky){
  var id = "b" + (++bannerSeq);
  var el = document.createElement("div");
  el.className = "banner " + kind;
  el.id = id;
  el.innerHTML = "<div>" + html + "</div>" + (sticky ? "" : '<button class="x" aria-label="Κλείσιμο">×</button>');
  if (!sticky) el.querySelector(".x").onclick = function(){ el.parentNode && el.parentNode.removeChild(el); };
  (kind === "ok" ? $("toasts") : $("banners")).appendChild(el);
  if (kind === "ok") setTimeout(function(){ el.parentNode && el.parentNode.removeChild(el); }, 2500);
  return id;
}
function showError(context, err){
  var msg = (err && (err.message || err.code)) ? (err.message || err.code) : String(err);
  if (window.console) console.error(context, err);
  showBanner("error", "<b>" + esc(context) + ":</b> " + esc(msg));
}
function showOk(msg){ showBanner("ok", esc(msg)); }


/* ==========================================================================
   5. FIREBASE / COLLECTIONS
   ========================================================================== */
function initFirebase(){
  /* Δύο λόγοι για offline mode: (α) δεν φόρτωσε το SDK από το CDN,
     (β) δεν έχει μπει ακόμα projectId. Και στις δύο περιπτώσεις η εφαρμογή
     ανοίγει κανονικά με ορατό banner αντί να σπάσει σιωπηλά. */
  if (typeof firebase === "undefined" || !firebase.firestore) {
    goOffline("Το Firebase SDK δεν φόρτωσε (πρόβλημα δικτύου/CDN).");
    return;
  }
  if (!FIREBASE_CONFIG.projectId) {
    goOffline("Δεν έχει οριστεί projectId στο FIREBASE_CONFIG.");
    return;
  }
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  } catch (e) {
    goOffline("Αποτυχία αρχικοποίησης Firebase: " + (e.message || e));
  }
}
function goOffline(reason){
  offline = true;
  db = null;
  showBanner("offline", "<b>Offline mode</b> — " + esc(reason) +
    " Οι αλλαγές κρατιούνται μόνο σε αυτή τη σελίδα και χάνονται με ανανέωση.", true);
}

/* Ένα top-level collection ανά οντότητα. */
function productsCol(){ return db.collection("products"); }
function salesCol(){ return db.collection("sales"); }
function settingsDoc(){ return db.collection("settings").doc("app"); }
function supplierOrdersCol(){ return db.collection("supplierOrders"); }

function snapToArray(snap){
  var arr = [];
  snap.forEach(function(doc){
    var d = doc.data();
    d.id = doc.id;
    arr.push(d);
  });
  return arr;
}

function startListeners(){
  if (!db) { renderAll(); return; }

  /* PRODUCTS: ΧΩΡΙΣ .limit(). Είναι μακρόβιες εγγραφές που πρέπει να
     φαίνονται ΟΛΕΣ επ' αόριστον. Ένα limit εδώ θα έκανε τα παλιά ρούχα να
     "εξαφανίζονται" αθόρυβα όταν προστεθούν καινούρια (γνωστό bug της άλλης
     εφαρμογής). Ο όγκος ενός καταστήματος (εκατοντάδες είδη) είναι ασήμαντος. */
  productsCol().onSnapshot(function(snap){
    products = snapToArray(snap);
    products.sort(function(a,b){ return (a.name || "").localeCompare(b.name || "", "el"); });
    renderAll();
  }, function(err){ showError("Φόρτωση προϊόντων", err); });

  settingsDoc().onSnapshot(function(doc){
    var d = doc.exists ? doc.data() : {};
    settings.employeePin = d.employeePin || DEFAULT_EMPLOYEE_PIN;
    settings.store = d.store || {};
    renderAll();
  }, function(err){ showError("Φόρτωση ρυθμίσεων", err); });

  /* SUPPLIER ORDERS: ΧΩΡΙΣ .limit(). Λίγες εγγραφές (μερικές τον μήνα) που
     πρέπει να μένουν όλες στο ιστορικό. Το ίδιο listener φέρνει και το
     draft (doc με id "draft"), που το ξεχωρίζουμε εδώ. */
  supplierOrdersCol().onSnapshot(function(snap){
    var all = snapToArray(snap), sent = [];
    var gotDraft = false;
    for (var i = 0; i < all.length; i++) {
      if (all[i].id === "draft") { gotDraft = true; draft = normalizeDraft(all[i]); }
      else sent.push(all[i]);
    }
    if (!gotDraft) draft = normalizeDraft({});
    sent.sort(function(a,b){ return (b.ts || 0) - (a.ts || 0); });
    supplierOrders = sent;
    renderAll();
  }, function(err){ showError("Φόρτωση παραγγελιών προμηθευτή", err); });

  subscribeToday();
  subscribeReport();

  /* Η βάρδια αλλάζει αυτόματα στα μεσάνυχτα. Αν η σελίδα μείνει ανοιχτή
     όλη νύχτα, πρέπει να ξαναστήσουμε τον listener στη νέα μέρα — αλλιώς
     ο υπάλληλος θα έγραφε στη σωστή μέρα αλλά θα έβλεπε τη χθεσινή λίστα. */
  setInterval(function(){
    var k = dayKey(new Date());
    if (k !== currentDay) {
      var wasToday = (reportDay === currentDay);
      currentDay = k;
      if (wasToday) reportDay = k;
      subscribeToday();
      subscribeReport();
      renderAll();
    }
  }, 30000);
}

/* SALES της σημερινής βάρδιας.
   Οι πωλήσεις είναι το collection υψηλού όγκου, αλλά ΔΕΝ το κόβουμε με
   .limit(N): το φιλτράρουμε με where('day','==',σήμερα). Έτσι το μέγεθος
   είναι φυσικά φραγμένο (μία μέρα) ΚΑΙ η αναφορά είναι πάντα πλήρης —
   ένα limit θα έκοβε αθόρυβα πωλήσεις από τη μέτρηση της βάρδιας.
   Ταξινόμηση client-side: ένα .orderBy('ts') μαζί με where σε άλλο πεδίο
   θα χρειαζόταν composite index στο console. */
function subscribeToday(){
  if (!db) return;
  if (unsubToday) unsubToday();
  unsubToday = salesCol().where("day", "==", currentDay).onSnapshot(function(snap){
    todaySales = snapToArray(snap);
    todaySales.sort(function(a,b){ return b.ts - a.ts; });
    if (reportDay === currentDay) reportSales = todaySales;
    renderAll();
  }, function(err){ showError("Φόρτωση πωλήσεων βάρδιας", err); });
}

/* SALES για την ημέρα που επιλέγει ο ιδιοκτήτης στην Αναφορά.
   Αν είναι η σημερινή, ξαναχρησιμοποιούμε τον listener της βάρδιας
   (όχι δεύτερο ίδιο query). */
function subscribeReport(){
  if (unsubReport) { unsubReport(); unsubReport = null; }
  if (reportDay === currentDay) { reportSales = todaySales; renderAll(); return; }
  if (!db) { reportSales = offlineSalesFor(reportDay); renderAll(); return; }
  reportSales = [];
  renderAll();
  unsubReport = salesCol().where("day", "==", reportDay).onSnapshot(function(snap){
    reportSales = snapToArray(snap);
    reportSales.sort(function(a,b){ return b.ts - a.ts; });
    renderAll();
  }, function(err){ showError("Φόρτωση αναφοράς", err); });
}

/* Offline mode: όλες οι πωλήσεις σε ένα local array. */
var offlineAllSales = [];
function offlineSalesFor(day){
  var out = [];
  for (var i = 0; i < offlineAllSales.length; i++) if (offlineAllSales[i].day === day) out.push(offlineAllSales[i]);
  out.sort(function(a,b){ return b.ts - a.ts; });
  return out;
}
function offlineRefresh(){
  todaySales = offlineSalesFor(currentDay);
  reportSales = offlineSalesFor(reportDay);
  renderAll();
}


/* ==========================================================================
   6. WRITES
   Όλα τα writes πάνε απευθείας στο Firestore doc. Όπου αλλάζει απόθεμα
   χρησιμοποιούμε TRANSACTION, γιατί δύο συσκευές (υπάλληλος + ιδιοκτήτης)
   μπορεί να γράφουν ταυτόχρονα στο ίδιο προϊόν.
   ========================================================================== */

/* ΠΩΛΗΣΗ: αφαιρεί qty από ένα μέγεθος και γράφει εγγραφή στο sales.
   Transaction: διαβάζει το ΤΡΕΧΟΝ απόθεμα από τον server, ώστε αν το
   τελευταίο τεμάχιο πουλήθηκε μόλις από άλλη συσκευή, να αποτύχει
   καθαρά αντί να πάει το απόθεμα αρνητικό. */
function recordSale(productId, size, qty){
  var p = findProduct(productId);
  var sale = {
    productId: productId,
    productName: p ? p.name : "",   /* snapshot του ονόματος: η αναφορά μένει σωστή κι αν σβηστεί/μετονομαστεί το προϊόν */
    productCode: p ? (p.code || "") : "",
    productColor: p ? (p.color || "") : "",
    productCategory: p ? (p.category || "") : "",
    size: size,
    qty: qty,
    day: currentDay,
    ts: Date.now(),
    by: role,
    undone: false
  };

  if (!db) {
    if (!p || sizeQty(p, size) < qty) return Promise.reject(new Error("Δεν υπάρχει αρκετό απόθεμα."));
    var sz = cloneSizes(p.sizes);
    for (var i = 0; i < sz.length; i++) if (sz[i].s === size) sz[i].q -= qty;
    p.sizes = sz;
    sale.id = newId();
    offlineAllSales.push(sale);
    offlineRefresh();
    return Promise.resolve();
  }

  var pRef = productsCol().doc(productId);
  var sRef = salesCol().doc();
  return db.runTransaction(function(t){
    return t.get(pRef).then(function(doc){
      if (!doc.exists) throw new Error("Το προϊόν δεν υπάρχει πια.");
      var sz = cloneSizes(doc.data().sizes);
      var found = false;
      for (var i = 0; i < sz.length; i++) {
        if (sz[i].s === size) {
          found = true;
          if (sz[i].q < qty) throw new Error("Δεν υπάρχει αρκετό απόθεμα (διαθέσιμα: " + sz[i].q + ").");
          sz[i].q -= qty;
        }
      }
      if (!found) throw new Error("Το μέγεθος " + size + " δεν υπάρχει πια.");
      t.update(pRef, { sizes: sz, ts: Date.now() });
      t.set(sRef, sale);
    });
  });
}

/* ΑΝΑΙΡΕΣΗ: ΔΕΝ σβήνουμε την πώληση. Τη σημαδεύουμε undone:true και
   επιστρέφουμε το τεμάχιο στο απόθεμα. Έτσι ο ιδιοκτήτης τη βλέπει στην
   αναφορά με αστερίσκο (ζητούμενο), και δεν μπορεί να "χαθεί" μια
   πώληση χωρίς ίχνος. */
function undoSale(saleId){
  if (!db) {
    for (var i = 0; i < offlineAllSales.length; i++) {
      var s = offlineAllSales[i];
      if (s.id === saleId && !s.undone) {
        s.undone = true; s.undoneTs = Date.now(); s.undoneBy = role;
        var p = findProduct(s.productId);
        if (p) {
          var sz = cloneSizes(p.sizes);
          for (var j = 0; j < sz.length; j++) if (sz[j].s === s.size) sz[j].q += s.qty;
          p.sizes = sz;
        }
      }
    }
    offlineRefresh();
    return Promise.resolve();
  }

  var sRef = salesCol().doc(saleId);
  return db.runTransaction(function(t){
    return t.get(sRef).then(function(sDoc){
      if (!sDoc.exists) throw new Error("Η πώληση δεν βρέθηκε.");
      var s = sDoc.data();
      if (s.undone) return; /* ήδη αναιρεμένη από άλλη συσκευή: τίποτα να κάνουμε */
      var pRef = productsCol().doc(s.productId);
      /* Στα transactions όλα τα reads πρέπει να γίνουν πριν τα writes. */
      return t.get(pRef).then(function(pDoc){
        if (pDoc.exists) {
          var sz = cloneSizes(pDoc.data().sizes);
          var found = false;
          for (var i = 0; i < sz.length; i++) if (sz[i].s === s.size) { sz[i].q += s.qty; found = true; }
          /* Αν το μέγεθος σβήστηκε στο μεταξύ, το ξαναδημιουργούμε για να μη χαθεί το τεμάχιο. */
          if (!found) sz.push({ s: s.size, q: s.qty });
          t.update(pRef, { sizes: sz, ts: Date.now() });
        }
        t.update(sRef, { undone: true, undoneTs: Date.now(), undoneBy: role });
      });
    });
  });
}

/* ΑΠΟΘΗΚΕΥΣΗ ΠΡΟΪΟΝΤΟΣ (ιδιοκτήτης).
   Πρόβλημα: ο ιδιοκτήτης ανοίγει τη φόρμα με απόθεμα M=5, στο μεταξύ ο
   υπάλληλος πουλάει 1 (M=4), ο ιδιοκτήτης πατάει Αποθήκευση με M=5 →
   η πώληση θα "ακυρωνόταν" σιωπηλά. Λύση: θυμόμαστε τις ποσότητες που
   είχε η φόρμα όταν άνοιξε (baseSizes) και γράφουμε μόνο τη ΔΙΑΦΟΡΑ που
   έκανε ο ιδιοκτήτης, πάνω στο τρέχον απόθεμα του server. */
function saveProduct(id, data, baseSizes){
  function merge(currentSizes){
    var out = [];
    for (var i = 0; i < data.sizes.length; i++) {
      var s = data.sizes[i].s;
      var formQ = data.sizes[i].q;
      var baseQ = baseSizes.hasOwnProperty(s) ? baseSizes[s] : null;
      var curQ = null;
      for (var j = 0; j < currentSizes.length; j++) if (currentSizes[j].s === s) curQ = currentSizes[j].q;
      var q;
      if (baseQ === null || curQ === null) q = formQ;      /* νέο μέγεθος */
      else q = curQ + (formQ - baseQ);                      /* εφαρμογή μόνο της διαφοράς */
      out.push({ s: s, q: Math.max(0, q) });
    }
    return out;
  }

  if (!db) {
    if (id) {
      var p = findProduct(id);
      p.name = data.name; p.code = data.code; p.color = data.color; p.category = data.category; p.photo = data.photo;
      p.sizes = merge(p.sizes || []); p.ts = Date.now();
    } else {
      products.push({ id: newId(), name: data.name, code: data.code, color: data.color, category: data.category, photo: data.photo, sizes: merge([]), ts: Date.now() });
      products.sort(function(a,b){ return a.name.localeCompare(b.name, "el"); });
    }
    renderAll();
    return Promise.resolve();
  }

  if (!id) {
    return productsCol().doc().set({
      name: data.name, code: data.code, color: data.color, category: data.category, photo: data.photo,
      sizes: merge([]), ts: Date.now(), createdTs: Date.now()
    });
  }
  var ref = productsCol().doc(id);
  return db.runTransaction(function(t){
    return t.get(ref).then(function(doc){
      var cur = doc.exists ? (doc.data().sizes || []) : [];
      t.set(ref, {
        name: data.name, code: data.code, color: data.color, category: data.category, photo: data.photo,
        sizes: merge(cur), ts: Date.now()
      }, { merge: true });
    });
  });
}

function deleteProduct(id){
  if (!db) {
    products = products.filter(function(p){ return p.id !== id; });
    renderAll();
    return Promise.resolve();
  }
  /* Οι παλιές πωλήσεις ΔΕΝ σβήνονται: κρατάνε productName ως snapshot,
     άρα οι αναφορές παλιών βαρδιών μένουν πλήρεις. */
  return productsCol().doc(id).delete();
}

/* ---------- Παραγγελία προμηθευτή ---------- */
function normalizeDraft(d){
  return {
    lines: (d && d.lines) || {},
    supplier: (d && d.supplier) || "",
    supplierInfo: (d && d.supplierInfo) || "",
    notes: (d && d.notes) || ""
  };
}
/* Κλειδί γραμμής: productId + "|" + μέγεθος. Ένα flat map αντί για nested,
   ώστε να γράφεται ολόκληρο με ένα set() — βλ. saveDraft. */
function lineKey(pid, size){ return pid + "|" + size; }
function draftQty(pid, size){ return draft.lines[lineKey(pid, size)] || 0; }

/* Γράφουμε ΟΛΟΚΛΗΡΟ το draft doc (set χωρίς merge). Με merge:true τα
   nested maps συγχωνεύονται, άρα μια γραμμή που μηδενίστηκε δεν θα
   έφευγε ποτέ από το Firestore. Το local draft ενημερώνεται αμέσως
   (optimistic), ώστε τα +/− να αντιδρούν χωρίς να περιμένουν δίκτυο. */
function saveDraft(){
  renderAll();
  if (!db) return;
  supplierOrdersCol().doc("draft").set({
    status: "draft",
    lines: draft.lines,
    supplier: draft.supplier,
    supplierInfo: draft.supplierInfo,
    notes: draft.notes,
    ts: Date.now()
  }).catch(function(err){ showError("Αποθήκευση καλαθιού", err); });
}
function setDraftQty(pid, size, qty){
  qty = Math.max(0, Math.min(9999, parseInt(qty, 10) || 0));
  var k = lineKey(pid, size);
  if (qty > 0) draft.lines[k] = qty; else delete draft.lines[k];
  saveDraft();
}

/* Γραμμές καλαθιού με τα στοιχεία του προϊόντος. Γραμμές για προϊόν που
   σβήστηκε στο μεταξύ αγνοούνται (δεν έχουμε πια όνομα/κωδικό να στείλουμε). */
function draftLines(){
  var out = [];
  for (var k in draft.lines) {
    if (!draft.lines.hasOwnProperty(k)) continue;
    var cut = k.indexOf("|"), pid = k.slice(0, cut), size = k.slice(cut + 1);
    var p = findProduct(pid);
    if (!p || !(draft.lines[k] > 0)) continue;
    out.push({ productId: pid, name: p.name, code: p.code || "", color: p.color || "", category: p.category || "", size: size, qty: draft.lines[k] });
  }
  return out;
}

/* Αριθμός παραγγελίας: ΕΤΟΣ-ΑΑΑ, αύξων ανά έτος (π.χ. 2026-003).
   Υπολογίζεται από το ιστορικό στον client: υπάρχει ένας μόνο χρήστης που
   ολοκληρώνει παραγγελίες (ο ιδιοκτήτης), άρα δεν χρειάζεται counter με
   transaction. */
function nextOrderNumber(){
  var y = new Date().getFullYear(), max = 0;
  for (var i = 0; i < supplierOrders.length; i++) {
    var o = supplierOrders[i];
    if (o.year === y && o.seq > max) max = o.seq;
  }
  var seq = max + 1;
  return { year: y, seq: seq, number: y + "-" + (seq < 10 ? "00" : seq < 100 ? "0" : "") + seq };
}

/* Ολοκλήρωση: η παραγγελία αποθηκεύεται ως ΣΤΙΓΜΙΟΤΥΠΟ (όνομα, κωδικός,
   κατηγορία ανά γραμμή), ώστε το PDF του ιστορικού να βγαίνει ίδιο ακόμα
   κι αν αργότερα αλλάξει ή σβηστεί το προϊόν. Οι φωτογραφίες ΔΕΝ
   αντιγράφονται (θα ξεπερνούσαν εύκολα το όριο 1MB του doc)· στο PDF
   μπαίνει η τρέχουσα φωτογραφία, αν το προϊόν υπάρχει ακόμα.
   Batch: νέο doc + άδειασμα καλαθιού γίνονται μαζί ή καθόλου. */
function finalizeOrder(){
  var lines = draftLines();
  if (!lines.length) return Promise.reject(new Error("Το καλάθι είναι άδειο."));
  var n = nextOrderNumber();
  var order = {
    status: "sent", number: n.number, year: n.year, seq: n.seq,
    ts: Date.now(), day: dayKey(new Date()),
    supplier: draft.supplier, supplierInfo: draft.supplierInfo, notes: draft.notes,
    lines: lines
  };
  /* Κρατάμε τον προμηθευτή στο νέο καλάθι: συνήθως είναι ο ίδιος. */
  var emptyDraft = { status: "draft", lines: {}, supplier: draft.supplier, supplierInfo: draft.supplierInfo, notes: "", ts: Date.now() };

  if (!db) {
    order.id = newId();
    supplierOrders.unshift(order);
    draft = normalizeDraft(emptyDraft);
    renderAll();
    return Promise.resolve(order);
  }
  var ref = supplierOrdersCol().doc();
  var batch = db.batch();
  batch.set(ref, order);
  batch.set(supplierOrdersCol().doc("draft"), emptyDraft);
  return batch.commit().then(function(){ order.id = ref.id; return order; });
}

function deleteSupplierOrder(id){
  if (!db) {
    supplierOrders = supplierOrders.filter(function(o){ return o.id !== id; });
    renderAll();
    return Promise.resolve();
  }
  return supplierOrdersCol().doc(id).delete();
}

function saveStoreInfo(store){
  if (!db) { settings.store = store; renderAll(); return Promise.resolve(); }
  return settingsDoc().set({ store: store }, { merge: true });
}

function saveEmployeePin(pin){
  if (!db) { settings.employeePin = pin; renderAll(); return Promise.resolve(); }
  return settingsDoc().set({ employeePin: pin }, { merge: true });
}

var loginRole = "employee";

function showLogin(){
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  selectLoginRole(loginRole);
  $("pin").value = "";
  $("loginErr").textContent = "";
  setTimeout(function(){ $("pin").focus(); }, 50);
}
function selectLoginRole(r){
  loginRole = r;
  var btns = document.querySelectorAll(".roles button");
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle("sel", btns[i].getAttribute("data-role") === r);
}
function tryLogin(){
  var pin = $("pin").value;
  var ok = loginRole === "owner" ? (pin === ADMIN_PIN) : (pin === settings.employeePin);
  if (!ok) { $("loginErr").textContent = "Λάθος PIN."; $("pin").value = ""; return; }
  setRole(loginRole);
}
function setRole(r){
  role = r;
  /* localStorage μπορεί να πετάξει (private mode σε παλιό Safari). Ο ρόλος
     είναι ευκολία, όχι κρίσιμο δεδομένο: αν αποτύχει, απλώς θα ζητηθεί
     ξανά PIN στο επόμενο άνοιγμα. */
  try { if (r) localStorage.setItem(LS_ROLE, r); else localStorage.removeItem(LS_ROLE); } catch (e) {}
  if (!r) { showLogin(); return; }
  tab = (r === "owner") ? "report" : "sell";
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  renderAll();
}
function savedRole(){
  try { var r = localStorage.getItem(LS_ROLE); return (r === "owner" || r === "employee") ? r : null; }
  catch (e) { return null; }
}


/* ==========================================================================
   8. RENDER
   Μία renderAll() που ξαναζωγραφίζει την τρέχουσα οθόνη από τα arrays.
   Καλείται από κάθε listener· έτσι όλες οι συσκευές μένουν συγχρονισμένες.
   ========================================================================== */
var TABS = {
  employee: [["sell","Πώληση"],["shift","Η βάρδια μου"]],
  owner:    [["report","Αναφορά βάρδιας"],["stock","Απόθεμα"],["order","Παραγγελία"],["sell","Πώληση"],["settings","Ρυθμίσεις"]]
};

function renderAll(){
  if (!role || $("app").classList.contains("hidden")) return;
  $("roleLabel").textContent = role === "owner" ? "Ιδιοκτήτης" : "Υπάλληλος";

  var tabs = TABS[role], h = "";
  for (var i = 0; i < tabs.length; i++) {
    h += '<button data-tab="' + tabs[i][0] + '"' + (tabs[i][0] === tab ? ' class="active"' : '') + '>' + tabs[i][1] + '</button>';
  }
  $("tabs").innerHTML = h;

  /* Κρατάμε focus/θέση cursor στο πεδίο αναζήτησης: αλλιώς κάθε snapshot
     (π.χ. πώληση από άλλη συσκευή) θα έκλεινε το πληκτρολόγιο στο κινητό. */
  /* Κρατάμε focus/θέση cursor σε όποιο πεδίο με id γράφει ο χρήστης
     (αναζήτηση, ποσότητες παραγγελίας, σημειώσεις): αλλιώς κάθε snapshot
     (π.χ. πώληση από άλλη συσκευή) θα έκλεινε το πληκτρολόγιο στο κινητό. */
  var active = document.activeElement;
  var keepId = (active && active.id && $("view").contains(active)) ? active.id : null;
  var caret = null;
  try { caret = keepId ? active.selectionStart : null; } catch (e) { caret = null; }

  var v = $("view");
  if (tab === "sell") v.innerHTML = renderSell();
  else if (tab === "shift") v.innerHTML = renderShift();
  else if (tab === "report") v.innerHTML = renderReport();
  else if (tab === "stock") v.innerHTML = renderStock();
  else if (tab === "settings") v.innerHTML = renderSettings();
  else if (tab === "order") v.innerHTML = renderOrder();

  if (keepId && $(keepId)) {
    $(keepId).focus();
    if (caret !== null) { try { $(keepId).setSelectionRange(caret, caret); } catch (e) {} }
  }
}

function matchesSearch(p){
  if (catFilter === "__none") { if (CATEGORIES.indexOf(p.category) >= 0) return false; }
  else if (catFilter && p.category !== catFilter) return false;
  if (!search) return true;
  var q = search.toLowerCase();
  return (p.name || "").toLowerCase().indexOf(q) >= 0 ||
         (p.code || "").toLowerCase().indexOf(q) >= 0 ||
         (p.color || "").toLowerCase().indexOf(q) >= 0 ||
         (p.category || "").toLowerCase().indexOf(q) >= 0;
}

/* Κουμπιά-φίλτρα κατηγοριών με πλήθος ειδών. Η "Χωρίς κατηγορία"
   εμφανίζεται μόνο αν υπάρχουν τέτοια είδη (π.χ. παλιά εγγραφή), ώστε
   να μην "χάνονται" ρούχα που δεν πέφτουν σε καμία από τις 5. */
function catBar(){
  var counts = {}, none = 0;
  for (var i = 0; i < products.length; i++) {
    var c = products[i].category;
    if (CATEGORIES.indexOf(c) >= 0) counts[c] = (counts[c] || 0) + 1; else none++;
  }
  var h = '<div class="cats"><button data-cat=""' + (catFilter === "" ? ' class="sel"' : '') + '>Όλα<span class="n">' + products.length + '</span></button>';
  for (var j = 0; j < CATEGORIES.length; j++) {
    var k = CATEGORIES[j];
    h += '<button data-cat="' + esc(k) + '"' + (catFilter === k ? ' class="sel"' : '') + '>' + esc(k) + '<span class="n">' + (counts[k] || 0) + '</span></button>';
  }
  if (none) h += '<button data-cat="__none"' + (catFilter === "__none" ? ' class="sel"' : '') + '>Χωρίς κατηγορία<span class="n">' + none + '</span></button>';
  return h + '</div>';
}
function photoHtml(p, cls){
  if (p && p.photo) return '<img class="' + cls + '" src="' + p.photo + '" alt="" loading="lazy">';
  return cls === "thumb" ? '<span class="thumb ph">' + esc((p && p.name || "?").charAt(0)) + '</span>' : '<span class="ph">' + esc((p && p.name || "?").charAt(0)) + '</span>';
}

function searchBox(placeholder){
  return '<input type="search" id="search" placeholder="' + esc(placeholder) + '" value="' + esc(search) + '" autocomplete="off">';
}

/* ---------- Πώληση ---------- */
function renderSell(){
  var h = '<div class="row"><h2>Πώληση</h2><span class="spacer"></span><span class="muted">Βάρδια: ' + esc(dayLabel(currentDay)) + '</span></div>';
  h += searchBox("Αναζήτηση: τίτλος, κωδικός στάμπας, χρώμα…") + catBar();
  var list = products.filter(matchesSearch);
  if (!products.length) return h + '<div class="card empty" style="margin-top:16px">Δεν υπάρχουν ακόμα ρούχα. ' + (role === "owner" ? 'Προσθέστε από την καρτέλα «Απόθεμα».' : 'Ο ιδιοκτήτης πρέπει να τα προσθέσει.') + '</div>';
  if (!list.length) return h + '<div class="empty">Κανένα αποτέλεσμα.</div>';
  h += '<div class="prod-grid">';
  for (var i = 0; i < list.length; i++) {
    var p = list[i];
    h += '<div class="card prod"><div class="photo">' + photoHtml(p, "") + '</div><div class="body"><div class="name">' + esc(p.name) + '</div>';
    h += '<div class="meta">' + esc([p.code, p.color, p.category].filter(Boolean).join(" · ") || " ") + '</div><div class="sizes">';
    var sz = p.sizes || [];
    if (!sz.length) h += '<span class="muted">Χωρίς μεγέθη</span>';
    for (var j = 0; j < sz.length; j++) {
      var q = sz[j].q, cls = "size" + (q <= 0 ? " zero" : (q <= LOW_STOCK ? " low" : ""));
      h += '<button class="' + cls + '" data-sell="' + esc(p.id) + '" data-size="' + esc(sz[j].s) + '"' + (q <= 0 ? ' disabled' : '') + '>' +
           '<span class="l">' + esc(sz[j].s) + '</span><span class="q">' + q + ' τμχ</span></button>';
    }
    h += '</div></div></div>';
  }
  return h + '</div>';
}

function openSellModal(pid, size){
  var p = findProduct(pid);
  if (!p) return;
  var max = sizeQty(p, size), qty = 1;
  function body(){
    return '<div class="card pad modal">' +
      '<h3>' + esc(p.name) + '</h3>' + (p.color ? '<div class="muted">Χρώμα: ' + esc(p.color) + '</div>' : '') + '<div class="muted">Μέγεθος <b>' + esc(size) + '</b> · διαθέσιμα ' + max + '</div>' +
      '<div class="qty"><button class="btn" data-q="-1">−</button><span class="v">' + qty + '</span><button class="btn" data-q="1">+</button></div>' +
      '<div class="row"><button class="btn" data-close>Ακύρωση</button><span class="spacer"></span>' +
      '<button class="btn primary" data-confirm>Καταχώριση πώλησης</button></div></div>';
  }
  var m = openModal(body());
  m.onclick = function(e){
    var t = e.target.closest ? e.target.closest("button") : null;
    if (e.target === m || (t && t.hasAttribute("data-close"))) { closeModal(); return; }
    if (!t) return;
    if (t.hasAttribute("data-q")) {
      qty = Math.min(max, Math.max(1, qty + (+t.getAttribute("data-q"))));
      m.innerHTML = body();
    } else if (t.hasAttribute("data-confirm")) {
      t.disabled = true; /* αποτροπή διπλής καταχώρισης με διπλό tap */
      recordSale(pid, size, qty).then(function(){
        closeModal();
        showOk("Καταχωρίστηκε: " + p.name + " · " + size + " × " + qty);
      }, function(err){ t.disabled = false; showError("Πώληση", err); });
    }
  };
}

/* Ετικέτα πώλησης: Διακριτικός Τίτλος + χρώμα (το ίδιο σχέδιο μπορεί να
   υπάρχει σε πολλά χρώματα ως ξεχωριστά προϊόντα). */
function saleLabel(s){ return s.productName + (s.productColor ? " · " + s.productColor : ""); }

function statsBlock(sales){
  var items = 0, lines = 0, undos = 0;
  for (var i = 0; i < sales.length; i++) {
    if (sales[i].undone) undos++;
    else { items += sales[i].qty; lines++; }
  }
  return '<div class="stats">' +
    '<div class="card stat"><div class="v">' + items + '</div><div class="k">Τεμάχια</div></div>' +
    '<div class="card stat"><div class="v">' + lines + '</div><div class="k">Πωλήσεις</div></div>' +
    '<div class="card stat"><div class="v">' + undos + (undos ? '<span class="star">*</span>' : '') + '</div><div class="k">Αναιρέσεις</div></div></div>';
}

/* ---------- Αναφορά βάρδιας (ιδιοκτήτης) ---------- */
function renderReport(){
  var h = '<div class="row"><h2>Αναφορά βάρδιας</h2><span class="spacer"></span>' +
    '<div class="row no-print"><button class="btn small" data-day="-1">‹</button>' +
    '<input type="date" id="reportDate" value="' + reportDay + '" max="' + currentDay + '" style="width:auto">' +
    '<button class="btn small" data-day="1"' + (reportDay >= currentDay ? ' disabled' : '') + '>›</button>' +
    '<button class="btn small" data-print>Εκτύπωση</button></div></div>';
  h += '<div class="muted">' + esc(dayLabel(reportDay)) + (reportDay === currentDay ? ' — σε εξέλιξη (ενημερώνεται ζωντανά)' : ' — κλειστή') + '</div>';
  h += statsBlock(reportSales);
  if (!reportSales.length) return h + '<div class="card empty">Καμία πώληση αυτή τη μέρα.</div>';

  /* Σύνοψη ανά ρούχο+μέγεθος: ΜΟΝΟ οι ενεργές πωλήσεις μετράνε. */
  var groups = {}, order = [];
  for (var i = 0; i < reportSales.length; i++) {
    var s = reportSales[i];
    if (s.undone) continue;
    var k = s.productId + "|" + s.size;
    if (!groups[k]) {
      /* Κατηγορία: προτιμάμε την τρέχουσα του προϊόντος (αν άλλαξε μετά),
         αλλιώς το snapshot που κρατήθηκε τη στιγμή της πώλησης. */
      var cp = findProduct(s.productId);
      groups[k] = { name: s.productName, code: s.productCode, color: (cp ? cp.color : s.productColor) || "", size: s.size, qty: 0, cat: (cp ? cp.category : s.productCategory) || "" };
      order.push(k);
    }
    groups[k].qty += s.qty;
  }
  function catIdx(c){ var i = CATEGORIES.indexOf(c); return i < 0 ? 99 : i; }
  order.sort(function(a,b){
    return (catIdx(groups[a].cat) - catIdx(groups[b].cat)) ||
           groups[a].name.localeCompare(groups[b].name, "el") ||
           (sizeRank(groups[a].size) - sizeRank(groups[b].size)) ||
           String(groups[a].size).localeCompare(String(groups[b].size));
  });

  h += '<h3 style="margin-top:8px">Τι πουλήθηκε</h3><div class="card" style="margin-bottom:20px"><table class="t"><thead><tr><th>Ρούχο</th><th>Μέγεθος</th><th class="num">Τεμάχια</th></tr></thead><tbody>';
  if (!order.length) h += '<tr><td colspan="3" class="muted">Όλες οι πωλήσεις αναιρέθηκαν.</td></tr>';
  /* Υποσύνολα ανά κατηγορία: γραμμή-επικεφαλίδα πριν από κάθε ομάδα. */
  var catTotals = {};
  for (var c0 = 0; c0 < order.length; c0++) { var gc = groups[order[c0]].cat; catTotals[gc] = (catTotals[gc] || 0) + groups[order[c0]].qty; }
  var lastCat = null;
  for (var g = 0; g < order.length; g++) {
    var r = groups[order[g]];
    if (r.cat !== lastCat) {
      lastCat = r.cat;
      h += '<tr class="cat-head"><td colspan="2">' + esc(r.cat || "Χωρίς κατηγορία") + '</td><td class="num">' + catTotals[r.cat] + '</td></tr>';
    }
    h += '<tr><td>' + esc(r.name) + (r.code || r.color ? ' <span class="muted">' + esc([r.code, r.color].filter(Boolean).join(" · ")) + '</span>' : '') + '</td><td>' + esc(r.size) + '</td><td class="num"><b>' + r.qty + '</b></td></tr>';
  }
  h += '</tbody></table></div>';

  /* Αναλυτικές κινήσεις: εδώ φαίνονται ΚΑΙ οι αναιρέσεις με αστερίσκο. */
  h += '<h3>Αναλυτικά <span class="muted" style="font-size:14px">(<span class="star">*</span> = αναιρέθηκε)</span></h3>';
  h += '<div class="card"><table class="t cards"><thead><tr><th>Ώρα</th><th>Ρούχο</th><th>Μέγεθος</th><th class="num">Τμχ</th><th>Από</th><th>Σημείωση</th></tr></thead><tbody>';
  for (var j = 0; j < reportSales.length; j++) {
    var x = reportSales[j], key = "rp" + x.id, open = openRows[key];
    h += '<tr data-row="' + key + '" class="' + (x.undone ? 'undone ' : '') + (open ? 'open' : '') + '">' +
      '<td class="primary"><span class="exp-toggle">' + (open ? '▴' : '▾') + '</span>' + timeLabel(x.ts) +
      '<span class="m-only"> · <span class="strike">' + esc(saleLabel(x)) + ' — ' + esc(x.size) + ' × ' + x.qty + '</span></span>' +
      (x.undone ? ' <span class="star">*</span>' : '') + '</td>' +
      '<td data-l="Ρούχο" class="d-only strike">' + esc(saleLabel(x)) + '</td>' +
      '<td data-l="Μέγεθος" class="d-only strike">' + esc(x.size) + '</td>' +
      '<td data-l="Τμχ" class="num d-only strike">' + x.qty + '</td>' +
      '<td data-l="Από">' + (x.by === "owner" ? "Ιδιοκτήτης" : "Υπάλληλος") + '</td>' +
      '<td data-l="Σημείωση">' + (x.undone ? '<span class="star">*</span> Αναιρέθηκε ' + timeLabel(x.undoneTs) + (x.undoneBy ? ' από ' + (x.undoneBy === "owner" ? "ιδιοκτήτη" : "υπάλληλο") : '') : '') + '</td></tr>';
  }
  return h + '</tbody></table></div>';
}

  }
  return h + '</tbody></table></div>';

function openProductModal(id){
  /* Μόνο ο ιδιοκτήτης προσθέτει/αλλάζει ρούχα και φωτογραφίες. Ο υπάλληλος
     δεν βλέπει καν την καρτέλα «Απόθεμα»· ο έλεγχος εδώ είναι δεύτερη
     δικλίδα σε περίπτωση που κάποιο κουμπί εμφανιστεί κατά λάθος σε άλλη
     οθόνη. (UI-level, όχι security boundary — βλ. ADMIN_PIN.) */
  if (role !== "owner") return;
  var p = id ? findProduct(id) : null;
  var rows = p ? cloneSizes(p.sizes) : [];
  /* baseSizes: οι ποσότητες τη στιγμή που άνοιξε η φόρμα (βλ. saveProduct). */
  var base = {};
  if (p) for (var i = 0; i < rows.length; i++) base[rows[i].s] = rows[i].q;
  var photo = p ? (p.photo || "") : "";
  /* Νέο ρούχο: προεπιλογή η κατηγορία που είναι επιλεγμένη στο φίλτρο,
     γιατί συνήθως ο ιδιοκτήτης περνάει πολλά ρούχα της ίδιας κατηγορίας. */
  var cat = p ? (p.category || "") : (CATEGORIES.indexOf(catFilter) >= 0 ? catFilter : "");
  if (!p) rows = presetRows(cat);

  /* Γραμμές μεγεθών για μια κατηγορία (ποσότητα 0). Χωρίς προεπιλογή →
     μία κενή γραμμή για να γράψει ο ιδιοκτήτης. */
  function presetRows(c){
    var list = CATEGORY_SIZES[c], out = [];
    if (!list) return [{ s: "", q: 0 }];
    for (var i = 0; i < list.length; i++) out.push({ s: list[i], q: 0 });
    return out;
  }

  function catOptions(){
    var h = '<option value="">— Επιλέξτε —</option>';
    for (var i = 0; i < CATEGORIES.length; i++) h += '<option' + (cat === CATEGORIES[i] ? ' selected' : '') + '>' + esc(CATEGORIES[i]) + '</option>';
    /* Αν ένα παλιό προϊόν έχει κατηγορία εκτός λίστας, τη δείχνουμε ώστε
       να μη σβηστεί σιωπηλά με την αποθήκευση. */
    if (cat && CATEGORIES.indexOf(cat) < 0) h += '<option selected>' + esc(cat) + '</option>';
    return h;
  }
  function photoFieldHtml(){
    return '<div class="photo">' + (photo ? '<img src="' + photo + '" alt="">' : '<span class="ph">+</span>') + '</div>' +
      '<div><label class="btn small" style="cursor:pointer">' + (photo ? 'Αλλαγή φωτογραφίας' : 'Προσθήκη φωτογραφίας') +
      '<input type="file" id="fPhoto" accept="image/*" class="hidden"></label>' +
      (photo ? ' <button class="btn small danger" data-rmphoto>Αφαίρεση</button>' : '') +
      '<div class="muted" style="font-size:12px;margin-top:6px">Από κάμερα ή αρχείο. Συμπιέζεται αυτόματα.</div></div>';
  }

  function sizeRowsHtml(){
    var h = "";
    for (var i = 0; i < rows.length; i++) {
      h += '<div class="sr"><input type="text" data-sl="' + i + '" value="' + esc(rows[i].s) + '" placeholder="π.χ. M, 42">' +
           '<input type="number" min="0" step="1" data-sq="' + i + '" value="' + rows[i].q + '">' +
           '<button class="btn small" data-rm="' + i + '" title="Αφαίρεση μεγέθους">×</button></div>';
    }
    return h;
  }
  function body(){
    return '<div class="card pad modal">' +
      '<h3>' + (p ? 'Επεξεργασία ρούχου' : 'Νέο ρούχο') + '</h3>' +
      '<div class="photo-field" id="photoField" style="margin-top:14px">' + photoFieldHtml() + '</div>' +
      /* Το πεδίο στο Firestore μένει "name" (όχι μετονομασία σε "title"):
         έτσι τα ρούχα και οι πωλήσεις που έχουν ήδη περαστεί συνεχίζουν να
         δουλεύουν χωρίς μετατροπή δεδομένων. Αλλάζει μόνο η ετικέτα. */
      '<div style="margin:0 0 14px"><label class="f">Διακριτικός Τίτλος *</label><input type="text" id="fName" value="' + esc(p ? p.name : "") + '"></div>' +
      '<div class="row" style="margin-bottom:14px;flex-wrap:nowrap"><div style="flex:1"><label class="f">Κωδικός Στάμπας</label><input type="text" id="fCode" value="' + esc(p ? p.code || "" : "") + '"></div>' +
      '<div style="flex:1"><label class="f">Χρώμα</label><input type="text" id="fColor" value="' + esc(p ? p.color || "" : "") + '" placeholder="π.χ. Μαύρο"></div></div>' +
      '<div style="margin-bottom:14px"><label class="f">Κατηγορία *</label><select id="fCat">' + catOptions() + '</select></div>' +
      '<label class="f">Μεγέθη & απόθεμα</label><div class="size-rows" id="sizeRows">' + sizeRowsHtml() + '</div>' +
      '<button class="btn small" data-add>+ Μέγεθος</button>' +
      (p ? '<p class="muted" style="font-size:12px">Αν γίνει πώληση ενώ η φόρμα είναι ανοιχτή, δεν χάνεται: αποθηκεύεται μόνο η αλλαγή που κάνατε εσείς.</p>' : '') +
      '<div class="row" style="margin-top:18px">' + (p ? '<button class="btn danger" data-del>Διαγραφή</button>' : '') +
      '<span class="spacer"></span><button class="btn" data-close>Ακύρωση</button><button class="btn primary" data-save>Αποθήκευση</button></div></div>';
  }
  /* Πριν ξαναζωγραφίσουμε τις γραμμές μεγεθών, διαβάζουμε ό,τι έχει
     πληκτρολογηθεί, αλλιώς το "+ Μέγεθος" θα έσβηνε τις αλλαγές. */
  function readRows(){
    var out = [];
    for (var i = 0; i < rows.length; i++) {
      var l = m.querySelector('[data-sl="' + i + '"]'), q = m.querySelector('[data-sq="' + i + '"]');
      out.push({ s: l ? l.value.trim() : rows[i].s, q: q ? Math.max(0, parseInt(q.value, 10) || 0) : rows[i].q });
    }
    rows = out;
  }

  var m = openModal(body());
  m.onchange = function(e){
    /* Αλλαγή κατηγορίας: ξαναγεμίζουμε τα μεγέθη ΜΟΝΟ αν δεν έχει μπει
       ακόμα καμία ποσότητα — αλλιώς θα σβήναμε απόθεμα που πληκτρολόγησε
       ή που ήδη υπάρχει. */
    if (e.target.id === "fCat") {
      readRows();
      var anyQty = false;
      for (var i = 0; i < rows.length; i++) if (rows[i].q > 0) anyQty = true;
      cat = e.target.value;
      if (!anyQty) { rows = presetRows(cat); $("sizeRows").innerHTML = sizeRowsHtml(); }
      return;
    }
    if (e.target.id !== "fPhoto" || !e.target.files || !e.target.files[0]) return;
    $("photoField").querySelector(".photo").innerHTML = '<span class="muted" style="font-size:12px">Επεξεργασία…</span>';
    resizePhoto(e.target.files[0]).then(function(url){
      photo = url;
      $("photoField").innerHTML = photoFieldHtml();
    }, function(err){
      $("photoField").innerHTML = photoFieldHtml();
      showError("Φωτογραφία", err);
    });
  };
  m.onclick = function(e){
    var t = e.target.closest ? e.target.closest("button") : null;
    if (e.target === m || (t && t.hasAttribute("data-close"))) { closeModal(); return; }
    if (!t) return;
    if (t.hasAttribute("data-rmphoto")) { photo = ""; $("photoField").innerHTML = photoFieldHtml(); return; }
    if (t.hasAttribute("data-add")) { readRows(); rows.push({ s: "", q: 0 }); $("sizeRows").innerHTML = sizeRowsHtml(); }
    else if (t.hasAttribute("data-rm")) { readRows(); rows.splice(+t.getAttribute("data-rm"), 1); $("sizeRows").innerHTML = sizeRowsHtml(); }
    else if (t.hasAttribute("data-del")) {
      if (!confirmInline(t, "Σίγουρα;")) return;
      deleteProduct(p.id).then(function(){ closeModal(); showOk("Διαγράφηκε."); }, function(err){ showError("Διαγραφή", err); });
    }
    else if (t.hasAttribute("data-save")) {
      readRows();
      var name = $("fName").value.trim();
      if (!name) { $("fName").focus(); return; }
      cat = $("fCat").value;
      if (!cat) { $("fCat").focus(); showError("Αποθήκευση", new Error("Επιλέξτε κατηγορία.")); return; }
      var seen = {}, clean = [];
      for (var i = 0; i < rows.length; i++) {
        if (!rows[i].s) continue;
        if (seen[rows[i].s]) { showError("Αποθήκευση", new Error("Το μέγεθος «" + rows[i].s + "» υπάρχει δύο φορές.")); return; }
        seen[rows[i].s] = true; clean.push(rows[i]);
      }
      t.disabled = true;
      saveProduct(p ? p.id : null, { name: name, code: $("fCode").value.trim(), color: $("fColor").value.trim(), category: cat, photo: photo, sizes: clean }, base)
        .then(function(){ closeModal(); showOk("Αποθηκεύτηκε."); }, function(err){ t.disabled = false; showError("Αποθήκευση", err); });
    }
  };
}

/* Συμπίεση φωτογραφίας στον browser πριν μπει στο Firestore.
   Μια φωτό κινητού είναι 3-8MB· το Firestore doc δέχεται έως 1MB. Τη
   ζωγραφίζουμε σε canvas με μέγιστη πλευρά PHOTO_MAX_PX και την εξάγουμε
   ως JPEG. Οι σύγχρονοι browsers εφαρμόζουν αυτόματα τον EXIF
   προσανατολισμό στο <img>, άρα η φωτό δεν βγαίνει γυρισμένη.
   Λευκό φόντο πριν το draw: τα PNG με διαφάνεια αλλιώς γίνονται μαύρα. */
function resizePhoto(file){
  return new Promise(function(resolve, reject){
    if (!/^image\//.test(file.type || "")) { reject(new Error("Το αρχείο δεν είναι εικόνα.")); return; }
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error("Δεν διαβάστηκε το αρχείο.")); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error("Μη υποστηριζόμενη μορφή εικόνας (π.χ. HEIC). Δοκιμάστε JPEG/PNG.")); };
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, PHOTO_MAX_PX / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
        var c = document.createElement("canvas");
        c.width = cw; c.height = ch;
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        var url = c.toDataURL("image/jpeg", PHOTO_QUALITY);
        if (url.length > PHOTO_MAX_BYTES) url = c.toDataURL("image/jpeg", 0.5);
        if (url.length > PHOTO_MAX_BYTES) { reject(new Error("Η φωτογραφία είναι πολύ μεγάλη ακόμα και μετά τη συμπίεση.")); return; }
        resolve(url);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Επιβεβαίωση με δεύτερο πάτημα στο ίδιο κουμπί, αντί για confirm():
   το native confirm μπλοκάρει όλη τη σελίδα και σε κάποια in-app browsers
   απλώς δεν εμφανίζεται. */
function confirmInline(btn, label){
  if (btn.getAttribute("data-armed")) return true;
  btn.setAttribute("data-armed", "1");
  var old = btn.textContent;
  btn.textContent = label;
  setTimeout(function(){ if (btn) { btn.removeAttribute("data-armed"); btn.textContent = old; } }, 3000);
  return false;
}

/* ---------- Παραγγελία προμηθευτή (ιδιοκτήτης) ---------- */

/* Μεγέθη που προσφέρονται για παραγγελία σε ένα προϊόν: όσα έχει ήδη ΣΥΝ
   τα προεπιλεγμένα της κατηγορίας του. Έτσι μπορεί να παραγγείλει π.χ. 3XL
   ακόμα κι αν δεν το είχε ποτέ πριν στο απόθεμα. */
function orderSizesFor(p){
  var out = [], seen = {}, sz = p.sizes || [], pre = CATEGORY_SIZES[p.category] || [];
  for (var i = 0; i < sz.length; i++) if (!seen[sz[i].s]) { seen[sz[i].s] = 1; out.push(sz[i].s); }
  for (var j = 0; j < pre.length; j++) if (!seen[pre[j]]) { seen[pre[j]] = 1; out.push(pre[j]); }
  out.sort(function(a,b){ return (sizeRank(a) - sizeRank(b)) || String(a).localeCompare(String(b)); });
  return out;
}
/* id για κάθε input ποσότητας, ώστε η renderAll να κρατάει το focus. */
function qtyInputId(pid, size){ return "oq_" + pid + "_" + String(size).replace(/[^A-Za-z0-9]/g, "_"); }

function renderOrder(){
  var lines = draftLines(), pieces = 0, byProd = {}, prodOrder = [];
  for (var i = 0; i < lines.length; i++) {
    pieces += lines[i].qty;
    if (!byProd[lines[i].productId]) { byProd[lines[i].productId] = []; prodOrder.push(lines[i].productId); }

  }

  var h = '<div class="row"><h2>Παραγγελία προμηθευτή</h2></div>';

  /* Στοιχεία προμηθευτή + σημειώσεις (αποθηκεύονται με το change, όχι σε
     κάθε πλήκτρο, για να μη γίνεται write ανά χαρακτήρα). */
  h += '<div class="ord-top"><div class="card pad">' +
    '<label class="f">Προμηθευτής</label><input type="text" id="ordSupplier" value="' + esc(draft.supplier) + '" placeholder="Επωνυμία προμηθευτή">' +
    '<label class="f" style="margin-top:10px">Στοιχεία επικοινωνίας προμηθευτή</label><input type="text" id="ordSupplierInfo" value="' + esc(draft.supplierInfo) + '" placeholder="Τηλέφωνο / email (προαιρετικά)">' +
    '</div><div class="card pad"><label class="f">Σημειώσεις παραγγελίας</label>' +
    '<textarea id="ordNotes" rows="4" placeholder="π.χ. επιθυμητή ημερομηνία παράδοσης">' + esc(draft.notes) + '</textarea></div></div>';

  /* Καλάθι */
  h += '<div class="card pad" style="margin-bottom:16px"><div class="row"><h3 style="margin:0">Καλάθι</h3>' +
    '<span class="muted">' + prodOrder.length + ' είδη · ' + pieces + ' τεμάχια</span><span class="spacer"></span>' +
    '<button class="btn" data-ordpreview' + (lines.length ? '' : ' disabled') + '>Προεπισκόπηση PDF</button>' +
    '<button class="btn primary" data-ordfinal' + (lines.length ? '' : ' disabled') + '>Ολοκλήρωση & PDF</button></div>';
  if (!lines.length) {
    h += '<div class="muted" style="padding:12px 0 0">Άδειο. Προσθέστε ποσότητες από τη λίστα παρακάτω.</div>';
  } else {
    h += '<div style="margin-top:10px">';
    prodOrder.sort(function(a,b){ return byProd[a][0].name.localeCompare(byProd[b][0].name, "el"); });
    for (var pi = 0; pi < prodOrder.length; pi++) {
      var ls = byProd[prodOrder[pi]], p0 = findProduct(prodOrder[pi]), tot = 0, chips = "";
      ls.sort(function(a,b){ return sizeRank(a.size) - sizeRank(b.size); });
      for (var li = 0; li < ls.length; li++) { tot += ls[li].qty; chips += '<span class="chip">' + esc(ls[li].size) + ' × ' + ls[li].qty + '</span>'; }
      h += '<div class="basket-line">' + photoHtml(p0, "thumb") + '<div style="flex:1"><b>' + esc(ls[0].name) + '</b>' +
        (ls[0].code || ls[0].color ? ' <span class="muted">' + esc([ls[0].code, ls[0].color].filter(Boolean).join(" · ")) + '</span>' : '') + '<div>' + chips + '</div></div>' +
        '<b>' + tot + '</b><button class="btn small" data-ordclear="' + esc(prodOrder[pi]) + '" title="Αφαίρεση από το καλάθι">×</button></div>';
    }
    h += '<div class="row" style="margin-top:10px"><span class="spacer"></span><button class="btn small danger" data-ordempty>Άδειασμα καλαθιού</button></div></div>';
  }
  h += '</div>';

  /* Λίστα προϊόντων με απόθεμα + ποσότητα προς παραγγελία */
  h += '<h3>Προσθήκη στο καλάθι</h3>' + searchBox("Αναζήτηση: τίτλος, κωδικός στάμπας, χρώμα…") + catBar();
  var list = products.filter(matchesSearch);
  if (!list.length) {
    h += '<div class="card empty" style="margin-top:12px">' + (products.length ? 'Κανένα αποτέλεσμα.' : 'Δεν υπάρχουν ακόμα ρούχα στο Απόθεμα.') + '</div>';
  } else {
    h += '<div class="card" style="margin-top:12px">';
    for (var j = 0; j < list.length; j++) {

        if (q) has = true;

          '<div class="st' + (st <= 0 ? ' zero' : '') + '">απόθεμα ' + st + '</div>' +

          '<button data-oq="' + esc(p.id) + '" data-os="' + esc(s) + '" data-d="1" aria-label="περισσότερα">+</button></div></div>';
      }
      h += '<div class="ord-prod' + (has ? ' has' : '') + '">' + photoHtml(p, "thumb") +
        '<div><b>' + esc(p.name) + '</b> <span class="muted">' + esc([p.code, p.color, p.category].filter(Boolean).join(" · ")) +
        ' · σύνολο αποθέματος ' + totalStock(p) + '</span><div class="ord-sizes">' + cells + '</div></div></div>';
    }
    h += '</div>';
  }

  /* Ιστορικό */
  h += '<h3 style="margin-top:24px">Ιστορικό παραγγελιών</h3>';
  if (!supplierOrders.length) {
    h += '<div class="card empty">Καμία ολοκληρωμένη παραγγελία ακόμα.</div>';
  } else {
    h += '<div class="card"><table class="t"><thead><tr><th>Αρ.</th><th>Ημερομηνία</th><th>Προμηθευτής</th><th class="num">Τεμάχια</th><th></th></tr></thead><tbody>';
    for (var o = 0; o < supplierOrders.length; o++) {
